# Anthropic list prices, USD per million tokens: the fallback when the pricing page
# can't be read at start and no copy of it has been saved (usdash/prices.py).
# Source: https://platform.claude.com/docs/en/about-claude/pricing
# cache_write is the 5-minute write (1.25x input); cache_write_1h is the 1-hour write (2x input).
# fast: fast mode's input and output prices; the cache prices keep their ratio to input.
# Claude Code's own cost-state totals match these prices (checked 2026-09-27).
verified: 2026-09-29
# Server-side web search, USD per 1,000 searches, on top of tokens (web fetch costs only tokens).
web_search: 10

models:
