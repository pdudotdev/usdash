[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usdash"
version = "0.1.0"
description = "A live terminal dashboard of your own Claude Code token costs and prompt-cache state."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["rich>=13", "pyyaml>=6", "certifi"]

[project.scripts]
usdash = "usdash.app:main"

[tool.setuptools]
packages = ["usdash"]

[tool.setuptools.package-data]
usdash = ["pricing.yaml"]
